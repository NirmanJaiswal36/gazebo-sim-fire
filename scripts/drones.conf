# Shared configuration. Sourced by start_drones.sh / stop_drones.sh / verify_drones.sh.

N_DRONES=5

WORLD=forest.sdf           # only used for the "start Gazebo first" hint
WORLD_NAME=forest
SESSION=drones             # tmux session name
RUN_DIR=/tmp/drones        # per-drone SITL dirs and logs

# Home position for every drone. This is the world's <spherical_coordinates>
# origin, and it is deliberately the SAME for all of them: ArduPilotPlugin
# reports position from components::WorldPose, i.e. NED relative to the Gazebo
# WORLD ORIGIN, not to the drone's own spawn pose. Each drone's actual position
# comes from its <pose> in the world. Giving each its own --home would add a
# second offset on top and put its EKF tens of metres off.
HOME_LOCATION=-35.389138,149.219188,580,0

VEHICLE=ArduCopter
FRAME=gazebo-iris          # NB: -f gazebo-iris --model JSON.
                           # README.md:257's "-f JSON" is stale; JSON is a
                           # --model value, not a registered frame.

# Port bases. Drone N gets base + 10*N, matching ArduPilot's "-I N adds 10*N to
# all ports" (libraries/AP_HAL_SITL/SITL_cmdline.cpp:90,260,461).
FDM_BASE=9002              # Gazebo binds this; the only port that MUST be unique
TCP_BASE=5760              # SITL serial0, what that drone's MAVProxy connects to
GCS_BASE=14550             # that drone's MAVProxy output

# Wipe each drone's EEPROM on start so the gimbal params always take effect.
# Set to 0 to keep parameter changes across restarts.
WIPE_EEPROM=1

# Extra MAVProxy output added to every drone, on top of its own 14550+10*N.
# $N is the drone index -- use it, or six drones all land on one endpoint.
#     EXTRA_OUT_TEMPLATE="127.0.0.1:$((15000 + N))"
EXTRA_OUT_TEMPLATE=""

# Remote GCS host. Drone N also sends to REMOTE_GCS_HOST:14550+10N and
# :14551+10N. The environment overrides this; set it empty to disable (the
# Docker setup passes it through, empty unless set in .env).
REMOTE_GCS_HOST="${REMOTE_GCS_HOST-10.115.79.225}"

# Extra args passed straight through to each MAVProxy (sim_vehicle.py -m).
MAVPROXY_ARGS=""
